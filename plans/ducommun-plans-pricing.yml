description: Ducommun is an aerospace and defense contract manufacturer (electronic and structural systems
  for aviation and defense primes). It is not a software or data-API vendor; integration with Ducommun
  is governed by supplier/customer master agreements (PO/EDI/PLM exchange) rather than a public REST API
  product. There is no developer portal, no published API pricing, and no commercial plan tiers.
sources:
  - https://www.ducommun.com/
notes: No public REST API or API plans; reconciled=false. Plan below describes the supplier/customer integration
  surface.
plans:
  - id: ducommun-supplier-customer
    name: Supplier / Customer Integration
    type: enterprise
    description: Customer/supplier integration via master agreement; PO, ASN, invoice, and PLM exchange
      handled through EDI or partner portals rather than a public API.
    entries:
      - label: Master agreement
        name: master_agreement
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: US
        unit: 1
        price: contact procurement / customer relations
        userMultiplied: false
    elements:
      - name: EDI document exchange (PO / ASN / invoice)
      - name: PLM / engineering data exchange
      - name: Defense / ITAR compliance
